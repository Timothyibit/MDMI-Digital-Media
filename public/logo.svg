<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Arc for The Master's Discipleship Ministries Int'l -->
    <path id="text-arc-top" d="M 65 250 A 185 185 0 1 1 435 250" fill="none" />
    <!-- Bottom Arc for Discipling to Serve -->
    <path id="text-arc-bottom" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
    
    <!-- Globe Gradient -->
    <radialGradient id="globe-grad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9AE62B" />
      <stop offset="70%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#65A30D" />
    </radialGradient>

    <!-- Cross Shadow -->
    <filter id="cross-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="250" cy="250" r="242" fill="#FFFFFF" stroke="#172B4D" stroke-width="12" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="#172B4D" stroke-width="8" />

  <!-- Outer Ring Text - Top -->
  <text fill="#172B4D" font-family="'Montserrat', -apple-system, sans-serif" font-size="22.5" font-weight="900" letter-spacing="1.8">
    <textPath href="#text-arc-top" startOffset="50%" text-anchor="middle">
      The Master's Discipleship Ministries Int'l
    </textPath>
  </text>

  <!-- Left Star -->
  <g transform="translate(85, 345) scale(0.95)">
    <polygon points="12,1 15,9 24,9 17,14 20,22 12,17 4,22 7,14 0,9 9,9" fill="#DC2626" stroke="#991B1B" stroke-width="0.5" />
  </g>

  <!-- Right Star -->
  <g transform="translate(390, 345) scale(0.95)">
    <polygon points="12,1 15,9 24,9 17,14 20,22 12,17 4,22 7,14 0,9 9,9" fill="#DC2626" stroke="#991B1B" stroke-width="0.5" />
  </g>

  <!-- Outer Ring Text - Bottom -->
  <text fill="#172B4D" font-family="'Montserrat', -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="3.5">
    <textPath href="#text-arc-bottom" startOffset="50%" text-anchor="middle">
      Discipling to Serve
    </textPath>
  </text>

  <!-- Inner Globe -->
  <g id="globe-center">
    <!-- Green Globe Circle -->
    <circle cx="250" cy="250" r="186" fill="url(#globe-grad)" stroke="#111827" stroke-width="6" />

    <!-- Globe Longitude & Latitude Grid Lines -->
    <!-- Center Meridian -->
    <line x1="250" y1="64" x2="250" y2="436" stroke="#1A2E05" stroke-width="3" opacity="0.85" />
    
    <!-- Left Meridian Arc -->
    <path d="M 250 65 C 160 140 160 360 250 435" fill="none" stroke="#1A2E05" stroke-width="3.5" opacity="0.9" />
    <!-- Right Meridian Arc -->
    <path d="M 250 65 C 340 140 340 360 250 435" fill="none" stroke="#1A2E05" stroke-width="3.5" opacity="0.9" />
    
    <!-- Outer Left Meridian Arc -->
    <path d="M 250 65 C 100 160 100 340 250 435" fill="none" stroke="#1A2E05" stroke-width="3" opacity="0.75" />
    <!-- Outer Right Meridian Arc -->
    <path d="M 250 65 C 400 160 400 340 250 435" fill="none" stroke="#1A2E05" stroke-width="3" opacity="0.75" />

    <!-- Equator -->
    <line x1="64" y1="250" x2="436" y2="250" stroke="#1A2E05" stroke-width="3" opacity="0.85" />

    <!-- Upper Latitude Arc -->
    <path d="M 95 160 C 180 200 320 200 405 160" fill="none" stroke="#1A2E05" stroke-width="3.5" opacity="0.9" />
    <!-- Lower Latitude Arc -->
    <path d="M 95 340 C 180 300 320 300 405 340" fill="none" stroke="#1A2E05" stroke-width="3.5" opacity="0.9" />

    <!-- Holy Spirit Dove (White, with olive twig) -->
    <g transform="translate(250, 140) scale(1.1)" filter="url(#cross-shadow)">
      <!-- Dove Body & Wings -->
      <path d="M 0 -22 
               C -8 -20 -18 -10 -26 -16 
               C -24 -6 -18 2 -12 6 
               C -18 8 -26 18 -18 20 
               C -12 21 -6 16 -3 10 
               C -2 16 -2 24 0 28 
               C 2 24 2 16 3 10 
               C 6 16 12 21 18 20 
               C 26 18 18 8 12 6 
               C 18 2 24 -6 26 -16 
               C 18 -10 8 -20 0 -22 Z"
            fill="#FFFFFF" 
            stroke="#172B4D" 
            stroke-width="3.2" 
            stroke-linejoin="round" />
      <!-- Olive Twig in Beak -->
      <path d="M 0 -22 C -4 -28 -10 -28 -14 -26 M -10 -28 C -12 -33 -8 -34 -6 -31" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="2.5" 
            stroke-linecap="round" />
    </g>

    <!-- Christian Red Latin Cross in the Center of the Earth -->
    <g id="central-cross" filter="url(#cross-shadow)">
      <!-- Cross Base / Pedestal -->
      <polygon points="218,362 282,362 274,342 226,342" fill="#B91C1C" stroke="#172B4D" stroke-width="3.5" />
      <polygon points="212,374 288,374 282,362 218,362" fill="#991B1B" stroke="#172B4D" stroke-width="3.5" />

      <!-- Main Vertical Shaft -->
      <rect x="236" y="200" width="28" height="144" rx="2" fill="#DC2626" stroke="#172B4D" stroke-width="3.5" />
      <!-- Horizontal Beam -->
      <rect x="202" y="235" width="96" height="26" rx="2" fill="#DC2626" stroke="#172B4D" stroke-width="3.5" />

      <!-- Cross Highlights & Details -->
      <rect x="240" y="204" width="8" height="136" fill="#EF4444" opacity="0.6" />
      <rect x="206" y="239" width="88" height="6" fill="#F87171" opacity="0.6" />
    </g>
  </g>
</svg>
