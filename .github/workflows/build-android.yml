name: Build Android APK & AAB Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Secure Keystore Injection from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MDMI_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'mdmi-devotionals' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'mdmi-devotionals' }}
          KEY_ALIAS_NAME: ${{ secrets.KEY_ALIAS || 'mdmi-key' }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/mdmi-signing.keystore
            echo "Private signing keystore loaded from GitHub Actions Secret."
          else
            echo "Notice: MDMI_KEYSTORE_BASE64 secret not yet set. Generating deterministic fallback key..."
            keytool -genkey -v -keystore android/app/mdmi-signing.keystore -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS_NAME" -keypass "$KEY_PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MDMI Devotionals,OU=Ministry,O=MDMI,C=US"
          fi

          echo "## Firebase Android Certificate Fingerprints" >> $GITHUB_STEP_SUMMARY
          SHA1_VAL=$(keytool -list -v -keystore android/app/mdmi-signing.keystore -alias "$KEY_ALIAS_NAME" -storepass "$KEYSTORE_PASS" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_VAL=$(keytool -list -v -keystore android/app/mdmi-signing.keystore -alias "$KEY_ALIAS_NAME" -storepass "$KEYSTORE_PASS" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "**Verified SHA-1 Fingerprint:** \`$SHA1_VAL\`" >> $GITHUB_STEP_SUMMARY
          echo "**Verified SHA-256 Fingerprint:** \`$SHA256_VAL\`" >> $GITHUB_STEP_SUMMARY
          echo "=================================================="
          echo "VERIFIED FIREBASE SHA-1: $SHA1_VAL"
          echo "VERIFIED FIREBASE SHA-256: $SHA256_VAL"
          echo "=================================================="

      - name: Build Sideloadable APK & Play Store AAB
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'mdmi-devotionals' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'mdmi-devotionals' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'mdmi-key' }}
        run: |
          cd android
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses 2>/dev/null || true
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Secure Cleanup (Shred Keystore from Runner)
        if: always()
        run: |
          if [ -f android/app/mdmi-signing.keystore ]; then
            shred -u android/app/mdmi-signing.keystore || rm -f android/app/mdmi-signing.keystore
            echo "Private signing keystore safely shredded from runner disk."
          fi

      - name: Upload Sideloadable APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: mdmi-devotionals-sideload-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Play Store AAB (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: mdmi-devotionals-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
