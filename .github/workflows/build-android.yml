name: Build Android APK & AAB Bundle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Deterministic Keystore & Extract Firebase SHA-1
        run: |
          mkdir -p android/app
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "## Firebase Android Certificate Fingerprints" >> $GITHUB_STEP_SUMMARY
          SHA1_VAL=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_VAL=$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "**SHA-1 Fingerprint:** \`$SHA1_VAL\`" >> $GITHUB_STEP_SUMMARY
          echo "**SHA-256 Fingerprint:** \`$SHA256_VAL\`" >> $GITHUB_STEP_SUMMARY
          echo "=================================================="
          echo "FIREBASE SHA-1 FINGERPRINT: $SHA1_VAL"
          echo "FIREBASE SHA-256 FINGERPRINT: $SHA256_VAL"
          echo "=================================================="

      - name: Build Sideloadable APK & Play Store AAB
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses 2>/dev/null || true
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload Sideloadable APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: mdmi-devotionals-sideload-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Play Store AAB (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: mdmi-devotionals-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
